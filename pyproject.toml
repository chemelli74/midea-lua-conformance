[project]
name = "midea-lua-conformance"
version = "0.1.0"
requires-python = ">=3.12"
description = "Checks midea-local's device protocol implementations against the official Midea Lua plugins from midea-lua-lib"
authors = [
{ name = "chemelli74", email = "simone.chemelli@gmail.com" }
]
license = "MIT"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
"midea-local",
]

[project.urls]
"Homepage" = "https://github.com/midea-lan/midea-lua-conformance"

[dependency-groups]
dev = [
    "build",
    "mypy",
    "pytest",
    "ruff",
]

[tool.uv-version]
# Source of truth for the uv version. All other version references must be derived from this value.
version = "0.13.6" # renovate: depName=uv datasource=pypi

[tool.setuptools.packages.find]
include = ["midea_lua_conformance*"]

[tool.pytest.ini_options]
addopts = "-v -Wdefault"
testpaths = ["tests"]

[tool.mypy]
files = ["midea_lua_conformance", "tests"]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true
disallow_untyped_decorators = false

[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"
