# This workflow runs on pushes and pull requests to the main branch.
# It checks commit messages, runs the linters, builds the Python package and runs tests.
name: PR and Python checks

on:
  # Trigger the workflow on push to main
  push:
    branches: ["main"]
  # Trigger the workflow on pull requests to main
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  commitlint:
    name: PR Commit Messages Check
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: wagoid/commitlint-github-action@v6.2.1
        with:
          configFile: commitlint.config.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      SKIP: no-commit-to-branch
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - uses: j178/prek-action@v3.1.0

  build:
    name: Python Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        os: ["windows-latest", "ubuntu-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Extract UV version
        run: |
          echo "UV_VERSION=$(./scripts/get-pyproject-uv.version.sh)" >> "$GITHUB_ENV"
        shell: bash
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          uv sync --frozen --all-groups --python ${{ matrix.python-version }}
        shell: bash
      - name: Activate virtualenv
        # Expose the .venv to later steps by putting it on PATH. On Windows the
        # venv layout is .venv/Scripts and GITHUB_PATH needs a native path
        # (cygpath).
        run: |
          if [ -d .venv/bin ]; then
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
            echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          else
            cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
            cygpath -w "$PWD/.venv" | sed 's/^/VIRTUAL_ENV=/' >> "$GITHUB_ENV"
          fi
        shell: bash
      - name: Build midea-lua-conformance
        run: python -m build
        shell: bash
      - name: Test with pytest
        run: python -m pytest --rootdir . ./tests/
        shell: bash
